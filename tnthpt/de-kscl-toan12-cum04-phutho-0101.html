ake": "Ý a): tính cả dây cung \\(2\\sqrt{R^2-d^2}\\) mà quên \\(M\\) nằm <i>bên trong<\/i> đường tròn nên chỉ có một phần dây thuộc đoạn \\(MN\\). Ý d): \\(P\\) thuộc đường thẳng \\(MN\\) nhưng không thuộc <i>đoạn<\/i> \\(MN\\).", "theory": "", "steps": ["Bán kính: \\(R^2=14400\\Rightarrow R=120\\) m \\(=12\\) đơn vị.", "<b>b)<\/b> Chiều cao \\(h=\\sqrt{125^2-120^2}=\\sqrt{625}=35\\) m → <b>Đúng<\/b>.", "<b>c)<\/b> \\(\\overrightarrow{MN}=(9;-12)\\), vectơ pháp tuyến \\((4;3)\\). Phương trình: \\(4(x-5)+3(y-10)=0\\iff4x+3y-50=0\\) → <b>Đúng<\/b>.", "<b>d)<\/b> \\(4\\cdot17+3\\cdot(-6)-50=0\\) nên \\(P\\) thuộc đường thẳng \\(MN\\), nhưng hoành độ trên đoạn chỉ từ 5 đến 14, mà \\(17&gt;14\\) → \\(P\\) nằm ngoài đoạn → <b>Sai<\/b>.", "<b>a)<\/b> \\(OM=\\sqrt{125}\\approx11{,}18&lt;12\\) (M trong vùng), \\(ON=\\sqrt{200}\\approx14{,}14&gt;12\\) (N ngoài vùng). Khoảng cách từ \\(O\\) tới \\(MN\\): \\(d=\\dfrac{50}{5}=10\\). Chân đường vuông góc \\(H(8;6)\\), \\(HM=5\\) (về phía ngược với N).", "Điểm ra khỏi vùng cách \\(H\\) một đoạn \\(\\sqrt{12^2-10^2}=\\sqrt{44}\\approx6{,}63\\) về phía \\(N\\). Phần nằm trong vùng dài \\(5+\\sqrt{44}\\approx11{,}63\\) đơn vị \\(\\approx116{,}3\\) m \\(\\ne120\\) m → <b>Sai<\/b>."], "conclusion": "a) Sai, b) Đúng, c) Đúng, d) Sai.", "note": "", "extra": ""}, {"type": "tf", "num": 2, "stem": "Cho hàm số \\(f(x)=x^3-4x^2-3x+2\\).", "items": ["\\(f'(x)=3x^2-8x-3\\).", "Hàm số có giá trị lớn nhất trên đoạn \\([-1;4]\\) bằng 2.", "Hàm số đã cho đồng biến trên khoảng \\(\\left(-\\dfrac13;3\\right)\\cup(3;+\\infty)\\).", "\\(f'(x)=0\\) có 2 nghiệm \\(x=3;\\ x=-\\dfrac13\\)."], "answer": [true, false, false, true], "hint": "Tính \\(f'(x)\\), giải \\(f'(x)=0\\), lập bảng xét dấu. GTLN trên đoạn: so sánh giá trị tại hai đầu mút và tại các nghiệm của \\(f'\\) trong đoạn.", "mistake": "Ý b): chỉ so sánh \\(f(-1)\\), \\(f(4)\\) mà quên điểm cực đại \\(x=-\\frac13\\). Ý c): nhầm khoảng giữa hai nghiệm (nơi \\(f'&lt;0\\)) là khoảng đồng biến.", "theory": "", "steps": ["<b>a)<\/b> \\(f'(x)=3x^2-8x-3\\) → <b>Đúng<\/b>.", "<b>d)<\/b> \\(3x^2-8x-3=0\\iff(x-3)(3x+1)=0\\iff x=3\\) hoặc \\(x=-\\frac13\\) → <b>Đúng<\/b>.", "<b>c)<\/b> \\(f'(x)&gt;0\\) khi \\(x&lt;-\\frac13\\) hoặc \\(x&gt;3\\); \\(f'(x)&lt;0\\) trên \\(\\left(-\\frac13;3\\right)\\). Vậy hàm <i>nghịch biến<\/i> trên \\(\\left(-\\frac13;3\\right)\\) → <b>Sai<\/b>.", "<b>b)<\/b> \\(f(-1)=0\\), \\(f\\!\\left(-\\frac13\\right)=\\frac{68}{27}\\approx2{,}52\\), \\(f(3)=-16\\), \\(f(4)=-10\\). GTLN là \\(\\frac{68}{27}\\ne2\\) → <b>Sai<\/b>."], "conclusion": "a) Đúng, b) Sai, c) Sai, d) Đúng.", "note": "", "extra": ""}, {"type": "tf", "num": 3, "stem": "Một cơ sở y tế sử dụng ứng dụng trí tuệ nhân tạo (AI) để phân tích hồ sơ sức khỏe và gửi cảnh báo cho những người có nguy cơ mắc bệnh. Trong một đợt thử nghiệm trên 100 người, có 30 người nhận cảnh báo, trong đó 24 người thực sự mắc bệnh; trong 70 người không nhận cảnh báo, có 4 người thực sự mắc bệnh. Người ta chọn ngẫu nhiên một số người từ nhóm trên; mọi nhóm người cùng số lượng đều có khả năng được chọn như nhau. Xét tính đúng sai của các khẳng định sau:", "items": ["Ta có bảng phân loại sau<div class=\"tw\"><table class=\"tb\"><tr><th>Kết quả<\/th><th>Mắc bệnh<\/th><th>Không mắc bệnh<\/th><\/tr><tr><td>Nhận cảnh báo<\/td><td>24<\/td><td>6<\/td><\/tr><tr><td>Không nhận cảnh báo<\/td><td>4<\/td><td>66<\/td><\/tr><\/table><\/div>", "Chọn ngẫu nhiên đồng thời hai người. Xác suất để cả hai người đều nhận cảnh báo bằng \\(0{,}091\\).", "Chọn ngẫu nhiên một người. Xác suất để người được chọn thực sự mắc bệnh bằng \\(0{,}28\\).", "Chọn ngẫu nhiên đồng thời ba người. Xác suất để có đúng hai người mắc bệnh, trong hai người đó ít nhất một người nhận cảnh báo bằng \\(\\dfrac{26784}{161700}\\)."], "answer": [true, false, true, true], "hint": "Lập bảng 2×2 trước. Chọn đồng thời \\(k\\) người từ 100 người: \\(n(\\Omega)=C_{100}^k\\). Với “ít nhất một” hãy dùng phần bù.", "mistake": "Ý b): tính \\(\\left(\\frac{30}{100}\\right)^2=0{,}09\\) như chọn có hoàn lại. Ý d): quên nhân thêm số cách chọn người thứ ba <i>không<\/i> mắc bệnh.", "theory": "", "steps": ["<b>a)<\/b> Nhận cảnh báo: \\(30-24=6\\) không mắc; không nhận cảnh báo: \\(70-4=66\\) không mắc → <b>Đúng<\/b>.", "<b>b)<\/b> \\(P=\\dfrac{C_{30}^2}{C_{100}^2}=\\dfrac{435}{4950}\\approx0{,}0879\\ne0{,}091\\) → <b>Sai<\/b>.", "<b>c)<\/b> Số người mắc bệnh: \\(24+4=28\\). \\(P=\\dfrac{28}{100}=0{,}28\\) → <b>Đúng<\/b>.", "<b>d)<\/b> Hai người mắc bệnh có ít nhất một người nhận cảnh báo: \\(C_{28}^2-C_4^2=378-6=372\\) cách. Người thứ ba không mắc bệnh: \\(6+66=72\\) cách.", "\\(P=\\dfrac{372\\cdot72}{C_{100}^3}=\\dfrac{26784}{161700}\\) → <b>Đúng<\/b>."], "conclusion": "a) Đúng, b) Sai, c) Đúng, d) Đúng.", "note": "", "extra": ""}, {"type": "tf", "num": 4, "stem": "Một doanh nghiệp vận tải được giao vận chuyển 100 tấn hàng từ kho đến một khu công nghiệp. Doanh nghiệp sử dụng một loại xe tải có khả năng chở tối đa 10 tấn hàng mỗi chuyến. Theo tính toán, khi mỗi chuyến xe chở \\(x\\) tấn hàng \\((0&lt;x\\le10)\\), chi phí vận chuyển mỗi chuyến (triệu đồng) gồm ba khoản: khoản thứ nhất bằng \\(0{,}2x^2\\); khoản thứ hai bằng \\(0{,}8x\\); khoản thứ ba là chi phí cố định 10 triệu đồng. Doanh nghiệp dự kiến chia đều 100 tấn hàng cho các chuyến xe. Gọi \\(f(x)\\) là chi phí bình quân để vận chuyển một tấn hàng (triệu đồng/tấn). Xét tính đúng sai của các khẳng định sau:", "items": ["Nếu chỉ xét bài toán tìm giá trị nhỏ nhất của hàm số \\(f(x)\\) trên đoạn \\([5;10]\\), chưa xét điều kiện số chuyến xe phải là số nguyên, thì chi phí bình quân nhỏ nhất khi \\(x=5\\sqrt2\\).", "Khi mỗi xe chở 5 tấn hàng chi phí bình quân 3,7 triệu đồng/tấn.", "Nếu số chuyến xe phải là số nguyên dương và khối lượng hàng được chia đều cho các chuyến thì doanh nghiệp cần thực hiện 14 chuyến để tổng chi phí vận chuyển nhỏ nhất.", "Chi phí bình quân được biểu diễn bởi hàm số \\(f(x)=\\dfrac{0{,}2x^2+0{,}8x+10}{x}\\) (triệu đồng/tấn)."], "answer": [true, false, true, true], "hint": "Chi phí bình quân một tấn = chi phí một chuyến : số tấn mỗi chuyến. Với ý c), gọi \\(n\\) là số chuyến thì \\(x=\\frac{100}{n}\\) và \\(n\\ge10\\); tính tổng chi phí theo \\(n\\) rồi thử các số nguyên gần điểm cực tiểu.", "mistake": "Ý c): làm tròn \\(x=5\\sqrt2\\approx7{,}07\\) thành 7 tấn rồi suy ra số chuyến, thay vì so sánh tổng chi phí với \\(n=14\\) và \\(n=15\\).", "theory": "", "steps": ["<b>d)<\/b> \\(f(x)=\\dfrac{0{,}2x^2+0{,}8x+10}{x}=0{,}2x+0{,}8+\\dfrac{10}{x}\\) → <b>Đúng<\/b>.", "<b>a)<\/b> \\(f'(x)=0{,}2-\\dfrac{10}{x^2}=0\\iff x^2=50\\iff x=5\\sqrt2\\in[5;10]\\); \\(f'\\) đổi dấu từ − sang + nên đây là điểm nhỏ nhất → <b>Đúng<\/b>.", "<b>b)<\/b> \\(f(5)=1+0{,}8+2=3{,}8\\ne3{,}7\\) → <b>Sai<\/b>.", "<b>c)<\/b> Với \\(n\\) chuyến (\\(n\\ge10\\)): tổng chi phí \\(T(n)=n\\left(0{,}2x^2+0{,}8x+10\\right)\\) với \\(x=\\frac{100}{n}\\), tức \\(T(n)=\\dfrac{2000}{n}+80+10n\\).", "\\(T\\) nhỏ nhất gần \\(n=\\sqrt{200}\\approx14{,}14\\). \\(T(14)\\approx362{,}86\\), \\(T(15)\\approx363{,}33\\). Vậy cần 14 chuyến → <b>Đúng<\/b>."], "conclusion": "a) Đúng, b) Sai, c) Đúng, d) Đúng.", "note": "", "extra": ""}]}, {"title": "PHẦN III. Trả lời ngắn (Câu 1–6)", "qs": [{"type": "sa", "num": 1, "stem": "Trong một đợt quan trắc vào mùa hè, tại đoạn sông Hồng chảy qua xã Nguyệt Đức, mực nước được mô phỏng bằng hàm số \\(h(t)=5+0{,}6\\cos\\left(\\dfrac{\\pi t}{6}\\right)\\) trong đó \\(h(t)\\) là độ cao mực nước (mét) so với mốc quan trắc và \\(t\\) là thời gian (giờ) tính từ khi bắt đầu quan trắc, với \\(0\\le t\\le120\\). Hỏi trong 5 ngày quan trắc, khoảng thời gian từ lần đầu tiên đến lần cuối cùng mực nước đạt độ cao 5 mét là bao nhiêu giờ?", "fields": [{"label": "Đáp số", "ans": 114, "show": "114", "tol": 0}], "hint": "Giải \\(h(t)=5\\iff\\cos\\frac{\\pi t}{6}=0\\), tìm nghiệm nhỏ nhất và lớn nhất trong \\([0;120]\\).", "mistake": "Lấy nghiệm đầu là \\(t=0\\) hoặc nghiệm cuối là \\(t=120\\) mà không kiểm tra; hoặc giải \\(\\cos=0\\) thành \\(\\frac{\\pi t}{6}=k\\pi\\).", "theory": "", "steps": ["\\(\\cos\\frac{\\pi t}{6}=0\\iff\\frac{\\pi t}{6}=\\frac{\\pi}{2}+k\\pi\\iff t=3+6k\\ (k\\in\\mathbb Z)\\).", "\\(0\\le3+6k\\le120\\iff -0{,}5\\le k\\le19{,}5\\Rightarrow k=0,1,\\dots,19\\).", "Lần đầu: \\(t=3\\); lần cuối: \\(t=3+6\\cdot19=117\\).", "Khoảng thời gian: \\(117-3=114\\) giờ."], "conclusion": "Đáp số: <b>114<\/b>.", "note": "", "extra": ""}, {"type": "sa", "num": 2, "stem": "Trong kế hoạch bổ sung tài liệu học tập cho thư viện, bốn trường THPT Phạm Công Bình, Đội Cấn, Võ Thị Sáu và Nguyễn Thị Giang cùng đặt mua ba loại sách tham khảo: sách Toán, sách Ngữ văn và sách Tiếng Anh. Biết rằng giá bán mỗi cuốn của từng loại sách là cố định và không thay đổi giữa các trường. Số lượng sách mỗi trường đặt mua và tổng số tiền phải thanh toán được thống kê trong bảng sau (số liệu giả định):<div class=\"tw\"><table class=\"tb\"><tr><th>Trường THPT<\/th><th>Sách Toán<\/th><th>Sách Ngữ văn<\/th><th>Sách Tiếng Anh<\/th><th>Tổng tiền (triệu đồng)<\/th><\/tr><tr><td>Đội Cấn<\/td><td>8<\/td><td>12<\/td><td>10<\/td><td>39<\/td><\/tr><tr><td>Võ Thị Sáu<\/td><td>5<\/td><td>10<\/td><td>15<\/td><td>32,5<\/td><\/tr><tr><td>Nguyễn Thị Giang<\/td><td>4<\/td><td>7<\/td><td>12<\/td><td>24,5<\/td><\/tr><tr><td>Phạm Công Bình<\/td><td>2<\/td><td>6<\/td><td>10<\/td><td>?<\/td><\/tr><\/table><\/div>Tính tổng số tiền mà trường THPT Phạm Công Bình phải thanh toán để mua số sách trên (đơn vị triệu đồng).", "fields": [{"label": "Đáp số", "ans": 18, "show": "18", "tol": 0}], "hint": "Gọi giá mỗi cuốn sách Toán, Ngữ văn, Tiếng Anh lần lượt là \\(a,b,c\\) (triệu đồng). Lập hệ 3 phương trình từ 3 trường đầu.", "mistake": "Bấm máy giải hệ nhưng nhập nhầm 32,5 thành 32 hoặc đổi chỗ cột số sách.", "theory": "", "steps": ["Hệ: \\(\\begin{cases}8a+12b+10c=39\\\\5a+10b+15c=32{,}5\\\\4a+7b+12c=24{,}5\\end{cases}\\)", "Giải (máy tính hoặc khử dần): \\(a=2,\\ b=1{,}5,\\ c=0{,}5\\).", "Kiểm tra dòng 1: \\(16+18+5=39\\) ✓.", "Phạm Công Bình: \\(2\\cdot2+6\\cdot1{,}5+10\\cdot0{,}5=4+9+5=18\\) (triệu đồng)."], "conclusion": "Đáp số: <b>18<\/b>.", "note": "", "extra": ""}, {"type": "sa", "num": 3, "stem": "Trong chương trình giao lưu Toán học, bốn trường THPT Phạm Công Bình, Đội Cấn, Võ Thị Sáu và Nguyễn Thị Giang, mỗi trường cử 5 học sinh tham gia. Kết quả một bài khảo sát giả định được cho trong bảng sau:<div class=\"tw\"><table class=\"tb\"><tr><th>Trường THPT<\/th><th>Số học sinh<\/th><th>Số học sinh đạt loại giỏi<\/th><\/tr><tr><td>Phạm Công Bình<\/td><td>5<\/td><td>1<\/td><\/tr><tr><td>Đội Cấn<\/td><td>5<\/td><td>4<\/td><\/tr><tr><td>Võ Thị Sáu<\/td><td>5<\/td><td>3<\/td><\/tr><tr><td>Nguyễn Thị Giang<\/td><td>5<\/td><td>2<\/td><\/tr><\/table><\/div>Ban tổ chức chọn ngẫu nhiên đồng thời 5 học sinh trong số 20 học sinh để thành lập một đội giao lưu. Tính xác suất để đội được chọn đồng thời có đúng 3 học sinh đạt loại giỏi, có đại diện của cả bốn trường và trong 2 học sinh không đạt loại giỏi có đúng 1 học sinh thuộc Trường THPT Phạm Công Bình. Làm tròn kết quả đến hàng phần trăm.", "fields": [{"label": "Đáp số", "ans": 0.08591331269349846, "show": "0,09", "tol": 0.005}], "hint": "Chọn 2 học sinh không giỏi trước: 1 em của Phạm Công Bình và 1 em của trường khác. Chia 3 trường hợp theo trường của em thứ hai, rồi đếm số cách chọn 3 học sinh giỏi sao cho đủ mặt hai trường còn thiếu (dùng phần bù).", "mistake": "Quên rằng học sinh giỏi cũng có thể thuộc Phạm Công Bình hoặc trường đã có mặt; hoặc bắt buộc mỗi trường đúng 1 em giỏi.", "theory": "", "steps": ["Học sinh không giỏi: PCB 4, Đội Cấn 1, Võ Thị Sáu 2, Nguyễn Thị Giang 3. Học sinh giỏi (10 em): PCB 1, ĐC 4, VTS 3, NTG 2. \\(n(\\Omega)=C_{20}^5=15504\\).", "<b>TH1:<\/b> em không giỏi thứ hai thuộc Đội Cấn (\\(4\\cdot1\\) cách). 3 em giỏi phải có VTS và NTG: \\(C_{10}^3-C_7^3-C_8^3+C_5^3=120-35-56+10=39\\). Được \\(4\\cdot39=156\\).", "<b>TH2:<\/b> thuộc Võ Thị Sáu (\\(4\\cdot2\\) cách). 3 em giỏi phải có ĐC và NTG: \\(120-C_6^3-C_8^3+C_4^3=120-20-56+4=48\\). Được \\(8\\cdot48=384\\).", "<b>TH3:<\/b> thuộc Nguyễn Thị Giang (\\(4\\cdot3\\) cách). 3 em giỏi phải có ĐC và VTS: \\(120-20-35+C_3^3=66\\). Được \\(12\\cdot66=792\\).", "Tổng: \\(156+384+792=1332\\). \\(P=\\dfrac{1332}{15504}\\approx0{,}0859\\approx0{,}09\\)."], "conclusion": "Đáp số: <b>0,09<\/b>.", "note": "", "extra": ""}, {"type": "sa", "num": 4, "stem": "Cho hàm số \\(y=f(x)=\\dfrac{2x^2+26x+18}{x+13}\\) có điểm cực tiểu \\(x=a\\) và điểm cực đại \\(x=b\\). Tính \\(P=a-2b\\).", "fields": [{"label": "Đáp số", "ans": 22, "show": "22", "tol": 0}], "hint": "Chia đa thức: \\(f(x)=2x+\\dfrac{18}{x+13}\\), rồi tính \\(f'(x)\\) và giải \\(f'(x)=0\\).", "mistake": "Nhầm điểm cực tiểu với điểm cực đại (với hàm dạng này, điểm cực tiểu là nghiệm <i>lớn<\/i> hơn).", "theory": "", "steps": ["\\(f(x)=2x+\\dfrac{18}{x+13}\\), \\(f'(x)=2-\\dfrac{18}{(x+13)^2}\\).", "\\(f'(x)=0\\iff(x+13)^2=9\\iff x=-10\\) hoặc \\(x=-16\\).", "Bảng dấu \\(f'\\): + trên \\((-\\infty;-16)\\), − trên \\((-16;-13)\\) và \\((-13;-10)\\), + trên \\((-10;+\\infty)\\). Nên cực đại \\(b=-16\\), cực tiểu \\(a=-10\\).", "\\(P=a-2b=-10-2(-16)=22\\)."], "conclusion": "Đáp số: <b>22<\/b>.", "note": "", "extra": ""}, {"type": "sa", "num": 5, "stem": "Cho hình chóp \\(S.ABCD\\) có đáy là hình vuông cạnh bằng 3, \\(SA\\perp(ABCD)\\), số đo của góc nhị diện \\([S,BC,A]\\) bằng \\(30^\\circ\\). Khoảng cách giữa hai đường thẳng \\(SC\\) và \\(BD\\) bằng \\(\\dfrac{a}{\\sqrt b}\\), trong đó \\((a,b\\in\\mathbb N^*)\\), \\(b\\) không có ước chính phương lớn hơn 1. Giá trị của \\(a+b\\) bằng bao nhiêu?", "fields": [{"label": "Đáp số", "ans": 17, "show": "17", "tol": 0}], "hint": "Góc nhị diện \\([S,BC,A]\\) là góc \\(\\widehat{SBA}\\) (vì \\(BC\\perp AB\\), \\(BC\\perp SB\\)). Tìm \\(SA\\), rồi gắn hệ trục tọa độ \\(A\\) là gốc để tính khoảng cách giữa hai đường chéo nhau.", "mistake": "Lấy góc \\(\\widehat{SCA}\\) thay cho \\(\\widehat{SBA}\\); hoặc để kết quả dạng \\(\\frac{3\\sqrt{14}}{14}\\) rồi cộng \\(3+14\\) sai dạng.", "theory": "", "steps": ["\\(\\tan\\widehat{SBA}=\\dfrac{SA}{AB}\\Rightarrow SA=3\\tan30^\\circ=\\sqrt3\\).", "Tọa độ: \\(A(0;0;0),B(3;0;0),D(0;3;0),C(3;3;0),S(0;0;\\sqrt3)\\).", "\\(\\overrightarrow{SC}=(3;3;-\\sqrt3)\\), \\(\\overrightarrow{BD}=(-3;3;0)\\), \\([\\overrightarrow{SC},\\overrightarrow{BD}]=(3\\sqrt3;3\\sqrt3;18)\\), độ dài \\(\\sqrt{27+27+324}=\\sqrt{378}=3\\sqrt{42}\\).", "\\(\\overrightarrow{SB}=(3;0;-\\sqrt3)\\), tích vô hướng với vectơ trên: \\(9\\sqrt3-18\\sqrt3=-9\\sqrt3\\).", "\\(d=\\dfrac{9\\sqrt3}{3\\sqrt{42}}=\\dfrac{3}{\\sqrt{14}}\\). Vậy \\(a=3,\\ b=14\\), \\(a+b=17\\)."], "conclusion": "Đáp số: <b>17<\/b>.", "note": "", "extra": ""}, {"type": "sa", "num": 6, "stem": "Một doanh nghiệp chế biến nông sản có công suất tối đa 200 tấn nguyên liệu mỗi tháng. Nếu chế biến \\(x\\) tấn nguyên liệu trong một tháng \\((1\\le x\\le200)\\), chi phí sản xuất \\(C(x)\\) và doanh thu \\(R(x)\\) (đơn vị: triệu đồng) lần lượt được xác định bởi: \\(C(x)=0{,}002x^3+24x+100;\\ R(x)=60x\\). Doanh nghiệp phải nộp một khoản thuế bằng 10% doanh thu và chi thêm 200 triệu đồng mỗi tháng cho quản lý, vận hành (chưa tính trong \\(C(x)\\)). Hỏi lợi nhuận lớn nhất doanh nghiệp có thể đạt được trong một tháng là bao nhiêu triệu đồng? (Làm tròn kết quả đến hàng đơn vị.)", "fields": [{"label": "Đáp số", "ans": 1114, "show": "1114", "tol": 0}], "hint": "Lợi nhuận = doanh thu − thuế − chi phí sản xuất − chi phí quản lý. Lập hàm \\(L(x)\\) rồi tìm GTLN trên \\([1;200]\\).", "mistake": "Quên trừ thuế 10% hoặc quên 200 triệu chi phí quản lý; tính thuế trên lợi nhuận thay vì trên doanh thu.", "theory": "", "steps": ["\\(L(x)=60x-0{,}1\\cdot60x-(0{,}002x^3+24x+100)-200=-0{,}002x^3+30x-300\\).", "\\(L'(x)=-0{,}006x^2+30=0\\iff x^2=5000\\iff x=50\\sqrt2\\approx70{,}71\\in[1;200]\\).", "\\(L'\\) đổi dấu từ + sang − nên đó là điểm lớn nhất: \\(L(50\\sqrt2)=50\\sqrt2(30-0{,}002\\cdot5000)-300=1000\\sqrt2-300\\approx1114{,}2\\).", "So với hai đầu: \\(L(1)\\approx-270\\), \\(L(200)=-10300\\)."], "conclusion": "Đáp số: <b>1114<\/b>.", "note": "", "extra": ""}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('qdata').textContent);
const Q=[];let submitted=false;
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([el]).catch(()=>{});}}
function parseNum(s){s=(s||'').replace(/\s+/g,'').replace(/−/g,'-');if(!s)return null;let pct=false;
 if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
 let v;if(/^[-+]?\d+([.,]\d+)?\/[-+]?\d+([.,]\d+)?$/.test(s)){const [a,b]=s.split('/').map(x=>parseFloat(x.replace(',','.')));if(b===0)return null;v=a/b;}
 else if(/^[-+]?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)){v=parseFloat(s.replace(',','.'));}else return null;
 return pct?v/100:v;}
document.getElementById('ttl').textContent=D.title;document.title=D.title;
const quiz=document.getElementById('quiz');
D.sections.forEach((sec,si)=>{if(!sec.qs.length)return;quiz.appendChild($('h2','',sec.title));
 sec.qs.forEach(q=>{q.si=si;build(q);});});
function build(q){const c=$('div','q');q.el=c;q.tries=0;q.locked=false;q.ok=null;
 c.appendChild($('div','qh','Câu '+q.num+'.'));c.appendChild($('div','stem',q.stem));
 if(q.type==='mc'){q.sel=null;const w=$('div','opts');q.btns=q.options.map((o,i)=>{const b=$('button','opt','<b>'+'ABCDEFGH'[i]+'.</b><span>'+o+'</span>');b.type='button';
   b.onclick=()=>{if(q.locked)return;q.sel=i;q.btns.forEach((x,j)=>x.classList.toggle('sel',j===i));ready(q);};w.appendChild(b);return b;});c.appendChild(w);}
 if(q.type==='tf'){q.sel=q.items.map(()=>null);q.rows=q.items.map((it,k)=>{const r=$('div','tfi');r.appendChild($('div','txt','<b>'+'abcdefgh'[k]+')</b> '+it));
   const bb=$('div','tfb');const bs=['Đúng','Sai'].map((t,v)=>{const b=$('button','',t);b.type='button';b.onclick=()=>{if(q.locked)return;q.sel[k]=(v===0);bs.forEach((x,j)=>x.classList.toggle('sel',j===v));ready(q);};bb.appendChild(b);return b;});
   r.appendChild(bb);c.appendChild(r);return {r,bs,bb};});}
 if(q.type==='sa'){q.inps=q.fields.map(f=>{const d=$('div','fld');const l=$('label','',f.label);const i=document.createElement('input');i.type='text';i.inputMode='decimal';i.autocomplete='off';
   i.oninput=()=>ready(q);i.onkeydown=e=>{if(e.key==='Enter'&&!q.chk.disabled)check(q);};d.appendChild(l);d.appendChild(i);c.appendChild(d);return {d,i};});}
 const act=$('div','act');q.chk=$('button','btn','Kiểm tra đáp án');q.chk.disabled=true;q.chk.onclick=()=>check(q);
 q.left=$('span','left hide','Còn 1 lần thử');q.tog=$('button','btn sec hide','Xem lời giải');q.tog.onclick=()=>{const h=q.solw.classList.toggle('hide');q.tog.textContent=h?'Xem lời giải':'Ẩn lời giải';};
 act.append(q.chk,q.left,q.tog);c.appendChild(act);
 q.fb=$('div','fb hide');c.appendChild(q.fb);
 q.hintEl=$('div','box hint hide','<h4>💡 Gợi ý</h4>'+q.hint);c.appendChild(q.hintEl);
 q.solw=$('div','hide');
 q.solw.appendChild($('div','box mis','<h4>⚠️ Lỗi sai thường gặp</h4>'+q.mistake));
 let s='<h4>📘 Hướng dẫn giải chi tiết</h4>';if(q.theory)s+='<div><i>Kiến thức cần nhớ:</i> '+q.theory+'</div>';
 s+='<ol>'+q.steps.map((t,i)=>'<li><span class="st">Bước '+(i+1)+':</span> '+t+'</li>').join('')+'</ol>';
 if(q.extra)s+=q.extra;s+='<div class="concl">'+q.conclusion+'</div>';if(q.note)s+='<div style="margin-top:6px"><i>Lưu ý:</i> '+q.note+'</div>';
 q.solw.appendChild($('div','box sol',s));c.appendChild(q.solw);
 quiz.appendChild(c);Q.push(q);}
function complete(q){if(q.type==='mc')return q.sel!==null;if(q.type==='tf')return q.sel.every(v=>v!==null);return q.inps.every(o=>o.i.value.trim()!=='');}
function ready(q){if(!q.locked)q.chk.disabled=!complete(q);}
function fmatch(f,v){if(v===null)return false;const tol=Math.max(f.tol||0,1e-9);return Math.abs(v-f.ans)<=tol;}
function grade(q){ // trả về {ok, parts:[bool], bad:parse error}
 if(q.type==='mc'){const ok=q.sel===q.answer;return {ok,parts:[ok]};}
 if(q.type==='tf'){const parts=q.sel.map((v,k)=>v===q.answer[k]);return {ok:parts.every(x=>x),parts};}
 const vals=q.inps.map(o=>parseNum(o.i.value));const parts=q.fields.map((f,k)=>fmatch(f,vals[k]));
 return {ok:parts.every(x=>x),parts,vals};}
function check(q){if(q.locked)return;
 if(q.type==='sa'){const vals=q.inps.map(o=>parseNum(o.i.value));if(vals.some(v=>v===null)){show(q.fb,'info','Chưa đọc được số. Hãy nhập số (vd 12; 0,25; 3/4). Lượt này không tính.');return;}}
 const g=grade(q);
 if(g.ok){finish(q,g,true);return;}
 if(q.tries===0){q.tries=1;show(q.fb,'bad','❌ Chưa đúng. Xem gợi ý rồi thử lại nhé.');q.hintEl.classList.remove('hide');q.chk.textContent='Kiểm tra lại';q.left.classList.remove('hide');typeset(q.hintEl);return;}
 finish(q,g,false);}
function show(el,cls,t){el.className='fb '+cls;el.innerHTML=t;}
function finish(q,g,ok){q.locked=true;q.ok=ok;q.chk.disabled=true;q.chk.classList.add('hide');q.left.classList.add('hide');
 q.el.classList.add(ok?'ok':'bad');
 if(q.type==='mc'){q.btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');if(i===q.answer)b.classList.add('right');else if(i===q.sel)b.classList.add('wrong');});}
 if(q.type==='tf'){q.rows.forEach((o,k)=>{o.bs.forEach(b=>b.disabled=true);if(!ok){o.r.classList.add(g.parts[k]?'right':'wrong');
   if(!g.parts[k])o.r.appendChild($('div','ca','Đáp án đúng: '+(q.answer[k]?'Đúng':'Sai')));}else o.r.classList.add('right');});}
 if(q.type==='sa'){q.inps.forEach((o,k)=>{o.i.disabled=true;o.i.classList.add(g.parts[k]?'right':'wrong');if(!g.parts[k])o.d.appendChild($('div','ca','Đáp án đúng: '+q.fields[k].show));});}
 if(ok){show(q.fb,'ok','✅ Chính xác!');q.hintEl.classList.add('hide');q.tog.classList.remove('hide');}
 else{let t='❌ Sai rồi.';if(q.type==='tf')t+=' Đúng '+g.parts.filter(x=>x).length+'/'+g.parts.length+' ý.';
   if(q.type==='mc')t+=' Đáp án đúng: '+'ABCDEFGH'[q.answer]+'.';show(q.fb,'bad',t+' Xem lời giải bên dưới.');
   q.solw.classList.remove('hide');q.tog.classList.remove('hide');q.tog.textContent='Ẩn lời giải';typeset(q.solw);}
 if(ok)typeset(q.solw);
 progress();}
function progress(){const done=Q.filter(q=>q.locked).length,ok=Q.filter(q=>q.ok===true).length,bad=Q.filter(q=>q.ok===false).length;
 document.getElementById('prog').textContent='Đã kiểm tra '+done+'/'+Q.length+' câu';
 document.getElementById('score').textContent='Đúng: '+ok+' · Sai: '+bad;
 document.getElementById('pbar').style.width=(100*done/Q.length)+'%';}
document.getElementById('submitBtn').onclick=()=>{if(submitted)return;
 const left=Q.filter(q=>!q.locked).length;
 if(!confirm(left?('Còn '+left+' câu chưa kiểm tra (bỏ trống tính là sai). Nộp bài?'):'Bạn chắc chắn muốn nộp bài?'))return;
 submitted=true;
 Q.forEach(q=>{if(q.locked)return;let g;
   if(!complete(q))g={ok:false,parts:(q.type==='tf'?q.sel.map((v,k)=>v===q.answer[k]):q.type==='sa'?q.fields.map((f,k)=>fmatch(f,parseNum(q.inps[k].i.value))):[false])};
   else{g=grade(q);}
   finish(q,g,g.ok);});
 const ok=Q.filter(q=>q.ok).length;
 let h='<div>Kết quả</div><div class="big">'+ok+' / '+Q.length+' câu đúng</div><div>Sai: '+(Q.length-ok)+' câu</div>';
 const secs=D.sections.filter(s=>s.qs.length);
 if(secs.length>1){h+='<table class="tb"><tr><th>Phần</th><th>Đúng</th><th>Sai</th></tr>';
  D.sections.forEach((s,si)=>{const qs=Q.filter(q=>q.si===si);if(!qs.length)return;const a=qs.filter(q=>q.ok).length;
   h+='<tr><td>'+s.title.split('.')[0]+'</td><td>'+a+'</td><td>'+(qs.length-a)+'</td></tr>';});h+='</table>';}
 const r=document.getElementById('result');r.innerHTML=h;r.style.display='block';
 const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Đã nộp bài';
 r.scrollIntoView({behavior:'smooth'});};
progress();
</script></body></html>
