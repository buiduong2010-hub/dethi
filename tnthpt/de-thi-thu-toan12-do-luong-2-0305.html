num": 2, "stem": "Một chất điểm chuyển động theo phương trình \\(s(t)=-t^3+9t^2+21t+9\\) với \\(t\\) tính bằng giây (s) là khoảng thời gian tính từ lúc vật bắt đầu chuyển động và \\(S\\) tính bằng mét (m) là quãng đường vật đi trong thời gian đó.", "items": ["Vận tốc của chất điểm chuyển động tại thời điểm \\(t\\) (giây) là \\(v(t)=-3t^2+18t+21\\).", "Vận tốc của chất điểm tại giây thứ 2 là 45 m/s.", "Quãng đường chất điểm đi được từ lúc bắt đầu đến lúc dừng hẳn là 255 (m).", "Vận tốc chuyển động của chất điểm đạt giá trị lớn nhất tại thời điểm \\(t=3\\) (s)."], "answer": [true, true, false, true], "hint": "\\(v(t)=s'(t)\\). Vật dừng hẳn khi \\(v(t)=0\\). Vận tốc là hàm bậc hai nên lớn nhất tại đỉnh parabol.", "mistake": "Ý c): giải \\(v=0\\) sai nghiệm, hoặc tính sai \\(s(7)\\). Ý d): nhầm “vận tốc lớn nhất” với “quãng đường lớn nhất”.", "theory": "", "steps": ["<b>a)<\/b> \\(v(t)=s'(t)=-3t^2+18t+21\\) → <b>Đúng<\/b>.", "<b>b)<\/b> \\(v(2)=-12+36+21=45\\) m/s → <b>Đúng<\/b>.", "<b>c)<\/b> \\(v(t)=0\\iff t^2-6t-7=0\\iff t=7\\) (loại \\(t=-1\\)). \\(s(7)=-343+441+147+9=254\\), \\(s(0)=9\\). Quãng đường từ lúc bắt đầu đến lúc dừng: \\(s(7)-s(0)=245\\) m \\(\\ne255\\) → <b>Sai<\/b>.", "<b>d)<\/b> \\(v(t)=-3(t-3)^2+48\\le48\\), dấu bằng khi \\(t=3\\) → <b>Đúng<\/b>."], "conclusion": "a) Đúng, b) Đúng, c) Sai, d) Đúng.", "note": "Dù hiểu quãng đường là \\(s(7)=254\\) hay \\(s(7)-s(0)=245\\) thì đều khác 255, nên ý c) vẫn Sai.", "extra": ""}, {"type": "tf", "num": 3, "stem": "Cho hàm số \\(y=f(x)\\). Có đồ thị như hình vẽ.<div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAXAAAAFMCAIAAABdw3C+AAApgElEQVR42u2deVxU9f7/32xuoOGCjQuCqZXLQK6EeE101FtqBplewKvRdbklYsa9CupXgpSuqfkQNDQyWgRuGJZekAxcCHDJ3CYVF3QgRCc0QhgkmRnm98fn53kQIM7OOXNez78+zHI4cz5nXvP5vFc7nU5HAABgDuxxCQAAEBQAAAQFAABBAQAACAoAAIICAICgAAAgKAAAAEEBAEBQAAAQFAAAgKAAACAoAAAICgAAggIAABAUAAAEBQAAQQEAAAgKAACCAkxFo9FoNBpcB3NhZ2dnZ2cXHByMSwFBESPp6elxcXG4DmahtraWDcaOHYurAUER4/IkIiIiOjqa+yYAU7hz5w4bdOvWDV n \\(d(O,(SCD))=\\frac12d(A,(SCD))\\) → <b>Sai<\/b>.", "<b>d)<\/b> Gọi \\(M\\) là trung điểm \\(CD\\), \\(OM=a\\). Kẻ \\(OH\\perp SM\\) thì \\(OH=d(O,(SCD))\\): \\(\\dfrac1{OH^2}=\\dfrac1{7a^2}+\\dfrac1{a^2}=\\dfrac8{7a^2}\\Rightarrow OH=\\dfrac{a\\sqrt{14}}4\\).", "Vậy \\(d(A,(SCD))=2OH=\\dfrac{a\\sqrt{14}}2\\ne\\dfrac{a\\sqrt{14}}4\\) → <b>Sai<\/b>."], "conclusion": "a) Đúng, b) Đúng, c) Sai, d) Sai.", "note": "", "extra": ""}]}, {"title": "PHẦN III. Trả lời ngắn (Câu 1–6)", "qs": [{"type": "sa", "num": 1, "stem": "Cho hàm số bậc ba \\(y=f(x)\\) có đồ thị như hình vẽ bên. Hỏi đồ thị hàm số \\(y=\\dfrac{(x^2+4x+3)\\sqrt{x^2+x}}{x\\left[f^2(x)-2f(x)\\right]}\\) có bao nhiêu đường tiệm cận đứng?<div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAATAAAAFACAIAAAC0u7dlAAAkTElEQVR42u2deVSU1/nHnxkWqeICCgU3tC6JWsdoXSKYKDouoS5H3ApYc0y0WvXgoZoo0QPBGj02GhtstAY1qRGptmppNTSAogGs1h2PiooCVRDBICCIMgzz++P+vBI2Z3vn3b6fv67Owjt33u/ce59VYzKZCAAgDbSYAgAgSAAABAkABAkAgCABgCABABAkABAkAACCBNLAaDRWVVVhHuyLM6YAWIrBYFi9evXly5dramqcnJy++eabbt26NXjO8+fPV6xY0a1bt1WrVmHGzEeD0DlgKREREcOGDQsNDa2pqWndunVgYGBKSkqD5+zZs+f999/39fUtLCzEjGHLCoTi0KFDWq02NDSUiJ48eWI0GtPS0p4/f97gacnJyUQ0cuRIzBi2rEBANm/e/N1337Hx2bNnicjV1dXV1bXB006ePElEY8aMwYxhhQRCkZ6e3qdPn3bt2rF/fvPNN0QUFBSk0WjqP+3GjRsPHz6EICFIICwlJSWLFi1i44qKin/84x9EFBYW1uBpaWlpRNSxY8ef//znmDRsWYFQBAcH1z9MPnv2rF27du+8805z+9UGKyfACgmE4q9//SsRTZs2zc3Nrf7/m0ymU6dOYb8KQQLHUVFRceLECSKaM2dOg4euX79eXFxMRIGBgZgoCBI4grS0tNra2latWun1+ib3q506derfvz8mCoIEjiAzM5OIhg8f3qpVqyYtOjhAQpDAcdy5c4eIGq+B/ACJ/SoECaykqqrq6tWrFr2EuSK9vb0b/P/ly5cfPXoEiw4ECaxny5Ytc+fOteglgwcPJqKKigr6cdB5ZGQkEyoOkBAksHJ5jI6OzsrKYsdCM5k2bZqHh8fRo0erq6u5GufOnXv69GksjxAksGl5ZIMlS5aY/yo/P79Dhw7V1dWNHTt2y5YtUVFRgYGBwcHBzMYDQRLSr4B1y6O7uzv/Z0ZGRkBAAFmSo3zmzJmCgoJevXoNHDjw4sWLI0eOdHFxycvL69y5M6aXEDoHrFse+SJ55coV81/u5ORUX8CJiYlENHPmTKgRKySwdXk0c5F88OBBWFhYRUVFcnKyp6cn///q6mo/P7+SkpLTp08jDRJnSGDl8qjT6VikW3h4uDknyQ0bNqSlpV24cOH27dv1/3/9+vUlJSUrVqyAGm3CBFRJZWUlE6HBYGC7JJPJdOzYMbZItvDCGTNmt : \\(x^2(x^2-3)(x+1)^2(x-2)\\).", "Điều kiện căn: \\(x\\le-1\\) hoặc \\(x\\ge0\\). Các nghiệm của mẫu nằm trong miền xét: \\(0,\\ -1,\\ \\pm\\sqrt3,\\ 2\\).", "Với \\(x\\) trong tập xác định: \\(y=\\dfrac{(x+3)\\sqrt{x^2+x}}{x^2(x^2-3)(x+1)(x-2)}\\). Tại \\(\\pm\\sqrt3\\) và \\(2\\) tử khác 0 → tiệm cận đứng.", "\\(x\\to0^+\\): \\(y\\sim\\dfrac{3\\sqrt x}{6x^2}\\to\\infty\\). \\(x\\to-1^-\\): \\(y\\sim\\dfrac{2\\sqrt{|x+1|}}{-6(x+1)}\\to\\infty\\). Vậy cả \\(x=0\\), \\(x=-1\\) đều là tiệm cận đứng.", "Tổng cộng 5 đường: \\(x=0,\\ x=-1,\\ x=-\\sqrt3,\\ x=\\sqrt3,\\ x=2\\)."], "conclusion": "Đáp số: <b>5<\/b>.", "note": "", "extra": ""}, {"type": "sa", "num": 2, "stem": "Anh Ba đang trên chiếc thuyền tại vị trí \\(A\\) cách bờ sông 2 km, anh dự định chèo thuyền vào bờ và tiếp tục chạy bộ theo một đường thẳng để đến một địa điểm \\(B\\) tọa lạc ven bờ sông, \\(B\\) cách vị trí \\(O\\) trên bờ gần với thuyền nhất là 4 km. Biết rằng anh Ba chèo thuyền với vận tốc 6 km/h và chạy bộ trên bờ với vận tốc 10 km/h. Khoảng thời gian (phút) ngắn nhất để anh Ba từ vị trí xuất phát đến được điểm \\(B\\) là bao nhiêu?<div class=\"fig\"><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAlgAAAE8CAIAAACTiVhaAAAicklEQVR42u3deVxU9f7H8c/AIAiIKwoqAiqIeyqmBu5cc1+pFG/uSyauqbld0VRyS0zTTMslzTWVzJRcU8R9RStFDXEDQUT2ZWaY3x/H+JkLAgEC83o+/OMw58wg3znyds77fM9R6fV6AQDAUBkxBAAAghAAAIIQAACCEAAAghAAAEOhzufvFxbGmAMA8pu9PZ8IAQAgCAEAIAgBACAIAQAgCAEAIAgBAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEIQAABCEAAAQhAAAEYWGUlJTo77+pcWPb9u3rHz68V6vVMiYAQBAakNWrvxg7tm9UVMS1a8GDBnU6dmw/YwIAhZRKr9fn5/cLCysKHwdr1bJ89hEXl3oBAZfZmQCgwLK35xNh7klOTnrukUePHjIsACAcGjUQZctad+3a59lHGjd2Z1gAgCA0IBMn+jZs2Czjy337dpw7F8SwAABBaCjs7Bz69fN+9pERIzyjo6MYGQAgCA2Om5uHiERFRYwe7cU8CgAgCA3OvHmrlSwMCjq4fLkvAwIABKEY3rRCf2trGxHx8/OhLAQAgtDgmJtbbNiwn7IQAAhCw+XiUnfWrGVCWQgABKHB6t/fm7IQAAjCwiclJUUoCwGAIBQDPc9lcaNG5XU6nVAWAgBBaGju3QtbtGh6YmJ8Ll4slLIQAAjCQmP27HGpqckiE elds": [{"label": "Đáp số", "ans": 1738, "show": "1738", "tol": 0}], "hint": "Tách thành hai biến cố độc lập: tam giác chọn được là tam giác vuông, và bộ ba số trên ba đỉnh lập thành cấp số cộng (vì cách gắn số là ngẫu nhiên). Tam giác nội tiếp vuông ⇔ có một cạnh là đường kính.", "mistake": "Đếm thiếu cấp số cộng có công sai 2 và 3; hoặc đếm tam giác vuông là \\(4\\cdot3\\).", "theory": "", "steps": ["Số tam giác: \\(C_8^3=56\\). Bát giác đều có 4 đường kính, mỗi đường kính ghép với 1 trong 6 đỉnh còn lại: \\(4\\cdot6=24\\) tam giác vuông. \\(P_1=\\dfrac{24}{56}=\\dfrac37\\).", "Bộ ba số trên ba đỉnh là một bộ 3 số bất kỳ trong 8 số, đồng khả năng (\\(C_8^3=56\\) bộ).", "Bộ lập thành cấp số cộng: công sai 1 có 6 bộ, công sai 2 có 4 bộ, công sai 3 có 2 bộ → 12 bộ. \\(P_2=\\dfrac{12}{56}=\\dfrac3{14}\\).", "\\(P=\\dfrac37\\cdot\\dfrac3{14}=\\dfrac9{98}\\Rightarrow m=9,\\ n=98\\).", "\\(8m+17n=72+1666=1738\\)."], "conclusion": "Đáp số: <b>1738<\/b>.", "note": "Hình chỉ là một ví dụ cách gắn số; đề nói gắn <i>ngẫu nhiên<\/i> nên ta không dùng cách gắn cố định trong hình.", "extra": ""}, {"type": "sa", "num": 6, "stem": "Một xưởng may rèm cửa gia đình, mỗi ngày hoàn thiện được \\(x\\) mét rèm \\((1\\le x\\le18)\\). Tổng chi phí sản xuất \\(x\\) mét rèm, tính bằng nghìn đồng, cho bởi hàm chi phí \\(C(x)=x^3-3x^2-20x+500\\). Giả sử xưởng may bán hết sản phẩm mỗi ngày với giá 220 nghìn đồng/mét. Gọi \\(L(x)\\) là lợi nhuận thu được khi bán \\(x\\) mét rèm. Hỏi lợi nhuận tối đa của xưởng may trong một ngày là bao nhiêu (đơn vị tính: nghìn đồng)?", "fields": [{"label": "Đáp số", "ans": 1200, "show": "1200", "tol": 0}], "hint": "\\(L(x)=220x-C(x)\\). Tìm GTLN trên \\([1;18]\\).", "mistake": "Đổi dấu sai khi trừ \\(C(x)\\) (đặc biệt \\(-(-20x)=+20x\\)).", "theory": "", "steps": ["\\(L(x)=220x-(x^3-3x^2-20x+500)=-x^3+3x^2+240x-500\\).", "\\(L'(x)=-3x^2+6x+240=0\\iff x^2-2x-80=0\\iff x=10\\) hoặc \\(x=-8\\) (loại).", "\\(L(1)=-258\\), \\(L(10)=-1000+300+2400-500=1200\\), \\(L(18)=-1040\\).", "Lợi nhuận tối đa là 1200 nghìn đồng."], "conclusion": "Đáp số: <b>1200<\/b>.", "note": "", "extra": ""}]}]}</script>
<script>
const D=JSON.parse(document.getElementById('qdata').textContent);
const Q=[];let submitted=false;
const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
function typeset(el){if(window.MathJax&&MathJax.typesetPromise){MathJax.typesetPromise([el]).catch(()=>{});}}
function parseNum(s){s=(s||'').replace(/\s+/g,'').replace(/−/g,'-');if(!s)return null;let pct=false;
 if(s.endsWith('%')){pct=true;s=s.slice(0,-1);}
 let v;if(/^[-+]?\d+([.,]\d+)?\/[-+]?\d+([.,]\d+)?$/.test(s)){const [a,b]=s.split('/').map(x=>parseFloat(x.replace(',','.')));if(b===0)return null;v=a/b;}
 else if(/^[-+]?(\d+([.,]\d*)?|[.,]\d+)$/.test(s)){v=parseFloat(s.replace(',','.'));}else return null;
 return pct?v/100:v;}
document.getElementById('ttl').textContent=D.title;document.title=D.title;
const quiz=document.getElementById('quiz');
D.sections.forEach((sec,si)=>{if(!sec.qs.length)return;quiz.appendChild($('h2','',sec.title));
 sec.qs.forEach(q=>{q.si=si;build(q);});});

 if(q.type==='mc'){q.sel=null;const w=$('div','opts');q.btns=q.options.map((o,i)=>{const b=$('button','opt','<b>'+'ABCDEFGH'[i]+'.</b><span>'+o+'</span>');b.type='button';
   b.onclick=()=>{if(q.locked)return;q.sel=i;q.btns.forEach((x,j)=>x.classList.toggle('sel',j===i));ready(q);};w.appendChild(b);return b;});c.appendChild(w);}
 if(q.type==='tf'){q.sel=q.items.map(()=>null);q.rows=q.items.map((it,k)=>{const r=$('div','tfi');r.appendChild($('div','txt','<b>'+'abcdefgh'[k]+')</b> '+it));
   const bb=$('div','tfb');const bs=['Đúng','Sai'].map((t,v)=>{const b=$('button','',t);b.type='button';b.onclick=()=>{if(q.locked)return;q.sel[k]=(v===0);bs.forEach((x,j)=>x.classList.toggle('sel',j===v));ready(q);};bb.appendChild(b);return b;});
   r.appendChild(bb);c.appendChild(r);return {r,bs,bb};});}
 if(q.type==='sa'){q.inps=q.fields.map(f=>{const d=$('div','fld');const l=$('label','',f.label);const i=document.createElement('input');i.type='text';i.inputMode='decimal';i.autocomplete='off';
   i.oninput=()=>ready(q);i.onkeydown=e=>{if(e.key==='Enter'&&!q.chk.disabled)check(q);};d.appendChild(l);d.appendChild(i);c.appendChild(d);return {d,i};});}
 const act=$('div','act');q.chk=$('button','btn','Kiểm tra đáp án');q.chk.disabled=true;q.chk.onclick=()=>check(q);
 q.left=$('span','left hide','Còn 1 lần thử');q.tog=$('button','btn sec hide','Xem lời giải');q.tog.onclick=()=>{const h=q.solw.classList.toggle('hide');q.tog.textContent=h?'Xem lời giải':'Ẩn lời giải';};
 act.append(q.chk,q.left,q.tog);c.appendChild(act);
 q.fb=$('div','fb hide');c.appendChild(q.fb);
 q.hintEl=$('div','box hint hide','<h4>💡 Gợi ý</h4>'+q.hint);c.appendChild(q.hintEl);
 q.solw=$('div','hide');
 q.solw.appendChild($('div','box mis','<h4>⚠️ Lỗi sai thường gặp</h4>'+q.mistake));
 let s='<h4>📘 Hướng dẫn giải chi tiết</h4>';if(q.theory)s+='<div><i>Kiến thức cần nhớ:</i> '+q.theory+'</div>';
 s+='<ol>'+q.steps.map((t,i)=>'<li><span class="st">Bước '+(i+1)+':</span> '+t+'</li>').join('')+'</ol>';
 if(q.extra)s+=q.extra;s+='<div class="concl">'+q.conclusion+'</div>';if(q.note)s+='<div style="margin-top:6px"><i>Lưu ý:</i> '+q.note+'</div>';
 q.solw.appendChild($('div','box sol',s));c.appendChild(q.solw);
 quiz.appendChild(c);Q.push(q);}
function complete(q){if(q.type==='mc')return q.sel!==null;if(q.type==='tf')return q.sel.every(v=>v!==null);return q.inps.every(o=>o.i.value.trim()!=='');}
function ready(q){if(!q.locked)q.chk.disabled=!complete(q);}
function fmatch(f,v){if(v===null)return false;const tol=Math.max(f.tol||0,1e-9);return Math.abs(v-f.ans)<=tol;}
function grade(q){ // trả về {ok, parts:[bool], bad:parse error}
 if(q.type==='mc'){const ok=q.sel===q.answer;return {ok,parts:[ok]};}
 if(q.type==='tf'){const parts=q.sel.map((v,k)=>v===q.answer[k]);return {ok:parts.every(x=>x),parts};}
 const vals=q.inps.map(o=>parseNum(o.i.value));const parts=q.fields.map((f,k)=>fmatch(f,vals[k]));
 return {ok:parts.every(x=>x),parts,vals};}
function check(q){if(q.locked)return;
 if(q.type==='sa'){const vals=q.inps.map(o=>parseNum(o.i.value));if(vals.some(v=>v===null)){show(q.fb,'info','Chưa đọc được số. Hãy nhập số (vd 12; 0,25; 3/4). Lượt này không tính.');return;}}
 const g=grade(q);
 if(g.ok){finish(q,g,true);return;}
 if(q.tries===0){q.tries=1;show(q.fb,'bad','❌ Chưa đúng. Xem gợi ý rồi thử lại nhé.');q.hintEl.classList.remove('hide');q.chk.textContent='Kiểm tra lại';q.left.classList.remove('hide');typeset(q.hintEl);return;}
 finish(q,g,false);}
function show(el,cls,t){el.className='fb '+cls;el.innerHTML=t;}
function finish(q,g,ok){q.locked=true;q.ok=ok;q.chk.disabled=true;q.chk.classList.add('hide');q.left.classList.add('hide');
 q.el.classList.add(ok?'ok':'bad');
 if(q.type==='mc'){q.btns.forEach((b,i)=>{b.disabled=true;b.classList.remove('sel');if(i===q.answer)b.classList.add('right');else if(i===q.sel)b.classList.add('wrong');});}
 if(q.type==='tf'){q.rows.forEach((o,k)=>{o.bs.forEach(b=>b.disabled=true);if(!ok){o.r.classList.add(g.parts[k]?'right':'wrong');
   if(!g.parts[k])o.r.appendChild($('div','ca','Đáp án đúng: '+(q.answer[k]?'Đúng':'Sai')));}else o.r.classList.add('right');});}
 if(q.type==='sa'){q.inps.forEach((o,k)=>{o.i.disabled=true;o.i.classList.add(g.parts[k]?'right':'wrong');if(!g.parts[k])o.d.appendChild($('div','ca','Đáp án đúng: '+q.fields[k].show));});}
 if(ok){show(q.fb,'ok','✅ Chính xác!');q.hintEl.classList.add('hide');q.tog.classList.remove('hide');}
 else{let t='❌ Sai rồi.';if(q.type==='tf')t+=' Đúng '+g.parts.filter(x=>x).length+'/'+g.parts.length+' ý.';
   if(q.type==='mc')t+=' Đáp án đúng: '+'ABCDEFGH'[q.answer]+'.';show(q.fb,'bad',t+' Xem lời giải bên dưới.');
   q.solw.classList.remove('hide');q.tog.classList.remove('hide');q.tog.textContent='Ẩn lời giải';typeset(q.solw);}
 if(ok)typeset(q.solw);
 progress();}
function progress(){const done=Q.filter(q=>q.locked).length,ok=Q.filter(q=>q.ok===true).length,bad=Q.filter(q=>q.ok===false).length;
 document.getElementById('prog').textContent='Đã kiểm tra '+done+'/'+Q.length+' câu';
 document.getElementById('score').textContent='Đúng: '+ok+' · Sai: '+bad;
 document.getElementById('pbar').style.width=(100*done/Q.length)+'%';}
document.getElementById('submitBtn').onclick=()=>{if(submitted)return;
 const left=Q.filter(q=>!q.locked).length;
 if(!confirm(left?('Còn '+left+' câu chưa kiểm tra (bỏ trống tính là sai). Nộp bài?'):'Bạn chắc chắn muốn nộp bài?'))return;
 submitted=true;
 Q.forEach(q=>{if(q.locked)return;let g;
   if(!complete(q))g={ok:false,parts:(q.type==='tf'?q.sel.map((v,k)=>v===q.answer[k]):q.type==='sa'?q.fields.map((f,k)=>fmatch(f,parseNum(q.inps[k].i.value))):[false])};
   else{g=grade(q);}
   finish(q,g,g.ok);});
 const ok=Q.filter(q=>q.ok).length;
 let h='<div>Kết quả</div><div class="big">'+ok+' / '+Q.length+' câu đúng</div><div>Sai: '+(Q.length-ok)+' câu</div>';
 const secs=D.sections.filter(s=>s.qs.length);
 if(secs.length>1){h+='<table class="tb"><tr><th>Phần</th><th>Đúng</th><th>Sai</th></tr>';
  D.sections.forEach((s,si)=>{const qs=Q.filter(q=>q.si===si);if(!qs.length)return;const a=qs.filter(q=>q.ok).length;
   h+='<tr><td>'+s.title.split('.')[0]+'</td><td>'+a+'</td><td>'+(qs.length-a)+'</td></tr>';});h+='</table>';}
 const r=document.getElementById('result');r.innerHTML=h;r.style.display='block';
 const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='Đã nộp bài';
 r.scrollIntoView({behavior:'smooth'});};
progress();
</script></body></html>
