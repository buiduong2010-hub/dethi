:root{--bg:#f4f6fb;--card:#fff;--ink:#1d2433;--mute:#5d6678;--line:#dfe3ec;--pri:#2457c5;--ok:#1a8f4c;--okbg:#e7f6ee;--bad:#c62f2f;--badbg:#fdecec;--warn:#9a6700;--warnbg:#fff6dd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:12px 12px 80px}
header h1{font-size:1.45rem;margin:14px 0 2px;color:var(--pri)}
header p{margin:0 0 10px;color:var(--mute)}
.bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.bar .in{max-width:860px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.92rem}
.prog{flex:1 1 160px;height:8px;background:#e6e9f1;border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.guide{background:#eef3ff;border:1px solid #cfdcff;border-radius:10px;padding:10px 14px;font-size:.93rem;margin:10px 0}
h2{font-size:1.12rem;margin:26px 0 10px;padding:8px 12px;background:#e9eefb;border-left:4px solid var(--pri);border-radius:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.q.ok{border-color:#9fd8b6}.q.bad{border-color:#f0b0b0}
.qt{margin-bottom:10px;overflow-x:auto}
.qt b.no{color:var(--pri)}
.fig{text-align:center;margin:8px 0;overflow-x:auto}.fig img{width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:8px;align-items:flex-start;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:inherit;overflow-x:auto}
.opt:hover:not(:disabled){border-color:#9db4ea;background:#f6f9ff}
.opt.sel{border-color:var(--pri);background:#eaf0ff}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.opt b{min-width:1.6em}
.tf{width:100%;border-collapse:collapse}
.tf td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:middle}
.tf td.s{overflow-x:auto}
.tf .btns{white-space:nowrap;text-align:right}
.tfb{min-width:44px;padding:7px 0;margin-left:4px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font:inherit;font-weight:700;cursor:pointer}
.tfb.sel{border-color:var(--pri);background:#eaf0ff;color:var(--pri)}
.tfb:disabled{cursor:default}
td.right{background:var(--okbg)} td.wrong{background:var(--badbg)}
.fld{margin:8px 0}
.fld label{display:block;font-weight:600;margin-bottom:4px;overflow-x:auto}
.fld input{width:100%;max-width:260px;padding:9px 11px;font:inherit;border:1.5px solid var(--line);border-radius:8px}
.fld input.right{border-color:var(--ok);background:var(--okbg)}
.fld input.wrong{border-color:var(--bad);background:var(--badbg)}
.corr{color:var(--ok);font-weight:600;font-size:.92rem;margin-top:3px}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.btn{padding:9px 16px;border:0;border-radius:9px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{background:#aab5cc;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.tries{color:var(--warn);font-size:.9rem}
.msg{margin-top:10px;padding:9px 12px;border-radius:9px;font-weight:600}
.msg.ok{background:var(--okbg);color:var(--ok)}.msg.bad{background:var(--badbg);color:var(--bad)}
.box{margin-top:10px;padding:10px 12px;border-radius:9px;overflow-x:auto}
.hint{background:var(--warnbg);border:1px solid #f1d98c}
.mist{background:#fff1e8;border:1px solid #f4c3a1}
.sol{background:#f3f7ff;border:1px solid #cfdcff}
.sol h4,.mist h4,.hint h4{margin:0 0 6px;font-size:1rem}
.sol p{margin:4px 0}
.sol .concl{font-weight:700;color:var(--ok)}
.sol .note{background:#fff;border-left:3px solid var(--warn);padding:6px 10px;margin-top:8px}
.hidden{display:none}
.submit{text-align:center;margin:28px 0}
.submit .btn{font-size:1.08rem;padding:12px 30px}
#result{background:#fff;border:2px solid var(--pri);border-radius:12px;padding:16px;text-align:center;margin:20px 0}
#result .big{font-size:1.8rem;font-weight:800;color:var(--pri)}
#result table{margin:10px auto;border-collapse:collapse}
#result td,#result th{border:1px solid var(--line);padding:5px 12px}
mjx-container{max-width:100%}

.hidden{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.card input[type=text]{width:100%;padding:10px;margin:4px 0 10px;font:inherit;border:1.5px solid var(--line);border-radius:8px}
.tm{font:700 1.3rem/1 monospace;color:var(--pri);padding:5px 10px;border:2px solid var(--pri);border-radius:8px}
.tm.warn{color:var(--warn);border-color:var(--warn)}.tm.bad{color:var(--bad);border-color:var(--bad);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.5}}
.sm{padding:6px 12px}
#nav{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.nb{width:36px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:#fff;font-weight:700;cursor:pointer}
.nb.done{background:var(--pri);color:#fff;border-color:var(--pri)}.nb.flag{border-color:#e08a00;box-shadow:0 0 0 2px #ffd38a}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90%}
.fb.on{background:#fff6dd;border-color:#e08a00;color:#9a6700}
body.run .q{user-select:none}body.run .q input{user-select:text}
#result{text-align:left}#result .big{text-align:center}#result .row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.opt.sel{background:#dbe7ff!important;border:2.5px solid var(--pri)!important;box-shadow:0 0 0 3px rgba(36,87,197,.25);font-weight:700}
.opt.sel b{background:var(--pri);color:#fff;border-radius:50%;min-width:1.7em;height:1.7em;display:inline-flex;align-items:center;justify-content:center}
.opt.sel::after{content:"✔ Đã chọn";margin-left:auto;color:var(--pri);font-weight:700;font-size:.85rem;white-space:nowrap}
.tfb.sel{background:var(--pri)!important;color:#fff!important;border-color:var(--pri)!important;transform:scale(1.1);box-shadow:0 0 0 3px rgba(36,87,197,.3)}
.opt:disabled,.tfb:disabled{opacity:1;color:inherit}.tfb.sel:disabled{color:#fff!important}
.fld input:not(:placeholder-shown){border-color:var(--pri);background:#eaf0ff;font-weight:700}
.opt.sel.right{background:var(--okbg)!important;border-color:var(--ok)!important}.opt.sel.right::after{content:"✔ Bạn chọn đúng";color:var(--ok)}
.opt.sel.wrong{background:var(--badbg)!important;border-color:var(--bad)!important}.opt.sel.wrong::after{content:"✘ Bạn đã chọn";color:var(--bad)}
.opt.right:not(.sel){border:2.5px solid var(--ok)}.opt.right:not(.sel)::after{content:"✔ Đáp án đúng";margin-left:auto;color:var(--ok);font-weight:700;font-size:.85rem}
.tfb.sel.rt{background:var(--ok)!important;border-color:var(--ok)!important}.tfb.sel.wr{background:var(--bad)!important;border-color:var(--bad)!important}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:#fff;max-width:460px;width:100%;border-radius:14px;padding:22px;border-top:7px solid var(--bad);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#mT{color:var(--bad);margin:0 0 10px;font-size:1.3rem}#mM{margin:0 0 16px}
.mbox.info{border-top-color:var(--pri)}.mbox.info #mT{color:var(--pri)}

function parseNum(s){s=(s||'').replace(/\s+/g,'').replace(/−/g,'-');if(!s)return null;let pct=false;if(s.endsWith('%')){pct=true;s=s.slice(0,-1)}s=s.replace(',','.');let v;

  ans.push({mc:'I',tf:'II',sa:'III'}[st.type]+'.'+st.q.no+':'+v)});
 const r2=x=>Math.round(x*100)/100,tot=mx.mc+mx.tf+mx.sa,k=CFG.SCALE10?10/tot:1;
 return{score:r2((p.mc+p.tf+p.sa)*k),total:r2(tot*k),p1:r2(p.mc*k),p2:r2(p.tf*k),p3:r2(p.sa*k),m1:r2(mx.mc*k),m2:r2(mx.tf*k),m3:r2(mx.sa*k),answers:ans.join(' | '),used:Math.round((S.end-S.start)/60000),viol:S.viol}}

let tmr,hb;
const endAt=()=>Math.min(S.start+CFG.DURATION*60000,CLOSE||Infinity);
function tick(){const left=endAt()-Date.now();
 if(left<=0){$('tm').textContent='00:00';submit('Hết giờ');return}
 const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);$('tm').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 $('tm').className='tm'+(left<300000?' bad':left<600000?' warn':'');
 [600,300,60].forEach(t=>{S.w=S.w||{};if(left<=t*1000&&!S.w[t]){S.w[t]=1;save();toast('⏰ Còn '+t/60+' phút!')}})}
const goFS=()=>{const d=document.documentElement;if(d.requestFullscreen&&!document.fullscreenElement)d.requestFullscreen().catch(()=>{})};
function modal(t,m,ok,okFn,no,cls){$('mBox').className='mbox'+(cls?' '+cls:'');$('mT').innerHTML=t;$('mM').innerHTML=m;$('mOk').textContent=ok;$('mNo').classList.toggle('hidden',!no);
 const hide=()=>$('modal').classList.add('hidden');$('mOk').onclick=()=>{hide();okFn&&okFn()};$('mNo').onclick=hide;$('modal').classList.remove('hidden')}
let lastV=0;
function viol(ev){if(!running())return;const n=Date.now();if(n-lastV<3000)return;lastV=n;S.viol++;save();send({type:'event',ev,viol:S.viol});
 if(S.viol>=CFG.MAX_VIOL){submit('Vi phạm '+CFG.MAX_VIOL+' lần');modal('⛔ Bài thi đã tự động nộp','Em đã vi phạm <b>'+S.viol+'/'+CFG.MAX_VIOL+'</b> lần (lần cuối: '+esc(ev)+').<br>Bài làm đã được nộp và báo về giáo viên.','Đóng');return}
 modal('⚠️ Cảnh báo vi phạm '+S.viol+'/'+CFG.MAX_VIOL,'<b>'+esc(ev)+'</b> — lần vi phạm này đã được báo về giáo viên.<br>Vi phạm thêm <b>'+(CFG.MAX_VIOL-S.viol)+'</b> lần nữa, bài sẽ <b>tự động nộp</b>.','Tôi hiểu, quay lại làm bài',goFS)}
document.addEventListener('visibilitychange',()=>{if(document.hidden)setTimeout(()=>{if(document.hidden)viol('Rời khỏi tab/cửa sổ bài thi')},400)}); // chờ 0,4s: tải lại trang thì không tính vi phạm
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)viol('Thoát toàn màn hình')});
['contextmenu','copy','cut','paste'].forEach(ev=>document.addEventListener(ev,e=>{if(running())e.preventDefault()}));
window.addEventListener('beforeunload',e=>{if(running()){e.preventDefault();e.returnValue=''}});
$('fsBtn').onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});

function lock(){$('quiz').querySelectorAll('button,input').forEach(x=>x.disabled=true);$('submitBtn').classList.add('hidden');$('fsBtn').classList.add('hidden');$('tm').classList.add('hidden');document.body.classList.remove('run')}
function sendResult(){const r=S.res;return send(Object.assign({type:'submit'},r)).then(ok=>{S.sent=ok;save();const e=$('sst');if(e)e.innerHTML=!CFG.SHEET_URL?'⚠️ Chưa bật gửi tự động: hãy bấm <b>Tải file kết quả</b> hoặc <b>Gửi email</b> cho giáo viên.':ok?'✅ Đã gửi bài về giáo viên.':'⚠️ Gửi thất bại, kiểm tra mạng rồi bấm <b>Gửi lại</b>.'})}
function submit(reason){if(!S||S.done)return;S.done=true;S.end=Date.now();S.reason=reason||'';S.res=calc();save();clearInterval(tmr);clearInterval(hb);
 if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});lock();showResult();sendResult();window.scrollTo(0,0)}
const canScore=()=>CFG.SHOW_SCORE&&Date.now()>=S.start+CFG.DURATION*60000;let sct;
function paintScore(){const b=$('scoreBox');if(!b)return;if(!CFG.SHOW_SCORE){clearInterval(sct);b.innerHTML='';return}
 const left=S.start+CFG.DURATION*60000-Date.now();
 if(left>0){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);b.innerHTML='<p>⏳ Điểm sẽ hiển thị khi hết thời gian thi (còn '+m+':'+String(s).padStart(2,'0')+').</p>';return}
 clearInterval(sct);const r=S.res;b.innerHTML='<div class="big">'+r.score+' / '+r.total+' điểm</div><table style="margin:8px auto"><tr><th>Phần</th><th>Điểm</th></tr><tr><td>I</td><td>'+r.p1+' / '+r.m1+'</td></tr><tr><td>II</td><td>'+r.p2+' / '+r.m2+'</td></tr><tr><td>III</td><td>'+r.p3+' / '+r.m3+'</td></tr></table>'}
function showResult(){const r=S.res,el=$('result');
 let h='<h3 style="margin-top:0">✅ Đã nộp bài'+(S.reason?' ('+esc(S.reason)+')':'')+'</h3><p>'+esc(S.info.name)+'<br>Thời gian làm: '+r.used+' phút · Số lần vi phạm: '+r.viol+'</p>';
 h+='<div id="scoreBox"></div>';
 h+='<p id="sst"></p><div class="row"><button class="btn ghost sm" id="rsBtn">Gửi lại</button><button class="btn ghost sm" id="dlBtn">Tải file kết quả</button>'+(CFG.TEACHER_EMAIL?'<button class="btn ghost sm" id="mlBtn">Gửi email</button>':'')+'</div>';
 h+='<div id="ulk" class="'+(S.unlocked?'hidden':'')+'"><p>🔒 Đáp án và lời giải sẽ mở khi giáo viên xác nhận cả lớp đã nộp bài. Nhập mã mở đáp án:</p><input type="text" id="code" style="max-width:200px;padding:8px;border:1.5px solid var(--line);border-radius:8px"> <button class="btn sm" id="ulkBtn">Mở đáp án</button></div>';
 el.innerHTML=h;el.classList.remove('hidden');clearInterval(sct);paintScore();sct=setInterval(paintScore,1000);
 $('sst').innerHTML=S.sent===undefined?'Đang gửi bài…':'';
 $('rsBtn').onclick=sendResult;
 $('dlBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({info:S.info,exam:CFG.EXAM_ID,result:canScore()?r:{answers:r.answers,used:r.used,viol:r.viol}},null,1)],{type:'application/json'}));a.download='ketqua_'+S.info.id+'.json';a.click()};
 if($('mlBtn'))$('mlBtn').onclick=()=>{location.href='mailto:'+CFG.TEACHER_EMAIL+'?subject='+encodeURIComponent('Nộp bài '+D.title+' - '+S.info.name)+'&body='+encodeURIComponent('Họ tên: '+S.info.name+(canScore()?'\nĐiểm: '+r.score+'/'+r.total:'')+'\nThời gian: '+r.used+' phút\nVi phạm: '+r.viol+'\nĐáp án: '+r.answers)};
 $('ulkBtn').onclick=()=>{if(relOK($('code').value)){S.unlocked=true;save();$('ulk').classList.add('hidden');review()}else toast('Mã chưa đúng')};
 $('who').textContent='';}
function review(){all.forEach(st=>{const g=grade(st),el=st.el,q=st.q,a=S.ans[st.key];el.classList.add(g.ok?'ok':'bad');
 if(st.type==='mc')el.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;if(i===q.ans)b.classList.add('right');else if(i===a)b.classList.add('wrong')});
 if(st.type==='tf')el.querySelectorAll('tr').forEach((tr,i)=>{tr.querySelector('td.s').classList.add(g.parts[i]?'right':'wrong');tr.querySelectorAll('.tfb.sel').forEach(x=>x.classList.add(g.parts[i]?'rt':'wr'));if(!g.parts[i]){const c=tr.querySelector('.corr');c.textContent='Đáp án đúng: '+(q.ans[i]?'Đúng':'Sai');c.classList.remove('hidden')}});
 if(st.type==='sa')el.querySelectorAll('input').forEach((inp,i)=>{inp.classList.add(g.parts[i]?'right':'wrong');if(!g.parts[i]){const c=inp.parentNode.querySelector('.corr');c.textContent='Đáp án đúng: '+q.fields[i].ans;c.classList.remove('hidden')}});
 el.querySelector('.act').remove();
 el.insertAdjacentHTML('beforeend',(g.ok?'':'<div class="box mist"><h4>⚠️ Lỗi sai thường gặp</h4>'+q.mistake+'</div>')+'<div class="box sol">'+solHTML(q,st)+'</div>')});
 typeset($('quiz'))}

function enter(){$('start').classList.add('hidden');$('exam').classList.remove('hidden');build();upd();$('who').innerHTML='Thí sinh: <b>'+esc(S.info.name)+'</b>';
 if(S.done){lock();showResult();if(S.res&&S.sent!==undefined)$('sst').innerHTML=S.sent?'✅ Đã gửi bài về giáo viên.':'⚠️ Chưa gửi được, bấm <b>Gửi lại</b> hoặc tải file/gửi email.';if(S.unlocked)review();else typeset($('quiz'));return}
 document.body.classList.add('run');typeset($('quiz'));tick();tmr=setInterval(tick,1000);
 const beat=()=>send({type:'hb',done:all.filter(isAns).length,total:all.length,left:Math.max(0,Math.round((endAt()-Date.now())/60000)),viol:S.viol});
 beat();hb=setInterval(beat,CFG.HB*1000)}
$('submitBtn').onclick=()=>{const left=all.filter(s=>!isAns(s)).length;modal('Nộp bài?',(left?'Còn <b>'+left+'</b> câu chưa làm. ':'Em đã làm hết các câu. ')+'Sau khi nộp sẽ không sửa được.','Nộp bài',()=>submit(''),true,'info')};
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[^a-z0-9]+/g,'');
$('fName').addEventListener('keydown',e=>{if(e.key==='Enter')$('goBtn').click()});
$('goBtn').onclick=()=>{const name=$('fName').value.trim().replace(/\s+/g,' ');
 if(name.split(' ').length<2){modal('Chưa nhập họ tên','Hãy nhập <b>đầy đủ họ và tên</b> (có dấu) rồi bấm Bắt đầu.','Đã hiểu',()=>$('fName').focus(),false,'info');return}
 S={info:{name,cls:'',id:slug(name)},start:Date.now(),ans:{},flags:{},viol:0,done:false};save();
 if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
 enter()};
function gate(){if(S&&S.start)return;const n=Date.now(),g=$('gate'),b=$('goBtn');let m='',off=false;
 if(OPEN&&n<OPEN){off=true;const d=Math.ceil((OPEN-n)/1000);m='⏳ Bài thi mở lúc '+CFG.OPEN_AT+' (còn '+Math.floor(d/3600)+':'+String(Math.floor(d%3600/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')+')'}
 else if(CLOSE&&n>=CLOSE){off=true;m='⛔ Bài thi đã đóng lúc '+CFG.CLOSE_AT}
 else if(CLOSE)m='Cổng thi đóng lúc '+CFG.CLOSE_AT+' — bài làm sẽ tự nộp khi đến giờ này.';
 g.textContent=m;b.disabled=off}
gate();setInterval(gate,1000);
if(GV){$('start').classList.add('hidden');$('gvp').classList.remove('hidden');$('gId').value=CFG.EXAM_ID;$('gUrl').value=CFG.SHEET_URL;
 $('gMake').onclick=()=>{const c={EXAM_ID:$('gId').value.trim()||CFG.EXAM_ID,DURATION:Math.max(1,+$('gDur').value||90),OPEN_AT:$('gOpen').value.replace('T',' '),CLOSE_AT:$('gClose').value.replace('T',' '),MAX_VIOL:Math.max(1,+$('gViol').value||5),SHOW_SCORE:$('gScore').checked,SHEET_URL:$('gUrl').value.trim()};
  const code=$('gCode').value.trim();if(code)c.RELEASE_HASH=H(code);
  $('gOut').value=location.href.split(/[?#]/)[0]+'?c='+encodeURIComponent(btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(c)))))};
 $('gCopy').onclick=()=>{$('gOut').select();document.execCommand('copy');toast('Đã sao chép link')}}
else if(S&&S.start){enter();if(running())send({type:'event',ev:'Tải lại/mở lại trang',viol:S.viol})}
})();
</script>
</body>
